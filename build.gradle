plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
    archivesName = 'mostructures-fabric'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Before 26.x the game is obfuscated: Mojang's official names, the same as in the 26.x code
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    // Fabric API loads the mod's data/ folder (structures, loot tables, worldgen) like a data pack
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    def props = [version: project.version, minecraft_version: minecraft_version, loader_version: loader_version]
    inputs.properties props

    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_mostructures" }
    }
}
